<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Studio MAX</title>
  <style>
    :root {
      --bg: #0d0f17;
      --card-bg: #161926;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #262b40;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; gap: 14px; }

    /* Табы Фото / Видео */
    .tabs { display: flex; background: var(--card-bg); border-radius: 12px; padding: 4px; border: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: var(--accent); color: #fff; }

    /* Поле ввода */
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; }
    textarea { width: 100%; height: 90px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 10px; font-size: 14px; resize: none; outline: none; }
    textarea:focus { border-color: var(--accent); }

    /* Чипы стилей */
    .chips-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .chip.active { background: rgba(99, 102, 241, 0.15); border-color: var(--accent); color: #fff; }

    /* Формат соотношения сторон */
    .ratio-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ratio-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 8px; border-radius: 8px; font-size: 12px; cursor: pointer; text-align: center; }
    .ratio-btn.active { border-color: var(--accent); color: #fff; font-weight: 600; }

    /* Кнопка генерации */
    .generate-btn { margin-top: 6px; padding: 14px; background: var(--accent); border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .generate-btn:hover { background: var(--accent-hover); }
    .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Окно предпросмотра */
    .preview-card { flex: 1; background: var(--card-bg); border: 1px dashed var(--border); border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 220px; position: relative; }
    .preview-placeholder { color: var(--text-muted); font-size: 13px; text-align: center; padding: 16px; }
    .preview-card img, .preview-card video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <!-- Выбор режима -->
  <div class="tabs">
    <button class="tab-btn active" onclick="setMode('image')">Фото</button>
    <button class="tab-btn" onclick="setMode('video')">Видео</button>
  </div>

  <!-- Описание -->
  <div class="input-group">
    <label>Промпт</label>
    <textarea id="promptInput" placeholder="Опишите сцену (например: неоновый киберпанк город под дождём)..."></textarea>
  </div>

  <!-- Стили -->
  <div class="input-group">
    <label>Стиль</label>
    <div class="chips-row" id="styleChips">
      <div class="chip active" onclick="selectStyle(this, 'Реализм')">Реализм</div>
      <div class="chip" onclick="selectStyle(this, 'Кинематографичный')">Кино</div>
      <div class="chip" onclick="selectStyle(this, 'Аниме')">Аниме</div>
      <div class="chip" onclick="selectStyle(this, '3D Рендер')">3D</div>
      <div class="chip" onclick="selectStyle(this, 'GTA V Style')">GTA 5</div>
    </div>
  </div>

  <!-- Формат кадра -->
  <div class="input-group">
    <label>Формат</label>
    <div class="ratio-group" id="ratioGroup">
      <div class="ratio-btn active" onclick="selectRatio(this, '1:1')">1:1 (Квадрат)</div>
      <div class="ratio-btn" onclick="selectRatio(this, '9:16')">9:16 (Stories)</div>
      <div class="ratio-btn" onclick="selectRatio(this, '16:9')">16:9 (Широкий)</div>
    </div>
  </div>

  <button class="generate-btn" id="genBtn" onclick="startGeneration()">
    <span>✨ Сгенерировать</span>
  </button>

  <!-- Результат -->
  <div class="preview-card" id="previewArea">
    <div class="preview-placeholder">Результат появится здесь после обработки</div>
  </div>

  <script>
    let currentMode = 'image';
    let selectedStyle = 'Реализм';
    let selectedRatio = '1:1';

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('promptInput').placeholder = mode === 'image' 
        ? 'Опишите сцену для генерации фото...' 
        : 'Опишите динамику и сюжет для короткого видео...';
    }

    function selectStyle(el, style) {
      document.querySelectorAll('#styleChips .chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      selectedStyle = style;
    }

    function selectRatio(el, ratio) {
      document.querySelectorAll('#ratioGroup .ratio-btn').forEach(r => r.classList.remove('active'));
      el.classList.add('active');
      selectedRatio = ratio;
    }

    async function startGeneration() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) {
        alert('Введите описание сцены');
        return;
      }

      const btn = document.getElementById('genBtn');
      const preview = document.getElementById('previewArea');

      btn.disabled = true;
      btn.innerText = 'Генерация... Пожалуйста, подождите';
      preview.innerHTML = '<div class="preview-placeholder">Нейросеть генерирует медиа...</div>';

      try {
        // Здесь подключается ваш сервер бэкенда (например, FastAPI / Node.js)
        // const response = await fetch('https://your-server.com/api/generate', {
        //   method: 'POST',
        //   headers: { 'Content-Type': 'application/json' },
        //   body: JSON.stringify({ mode: currentMode, prompt, style: selectedStyle, ratio: selectedRatio })
        // });
        // const data = await response.json();

        // Имитация ответа
        setTimeout(() => {
          if (currentMode === 'image') {
            preview.innerHTML = `<img src="https://picsum.photos/600/600" alt="Generated visual">`;
          } else {
            preview.innerHTML = `<div class="preview-placeholder">Видео готово! Передано в чат-бот.</div>`;
          }
          btn.disabled = false;
          btn.innerText = '✨ Сгенерировать';
        }, 2000);

      } catch (err) {
        preview.innerHTML = '<div class="preview-placeholder" style="color: #ef4444;">Ошибка генерации</div>';
        btn.disabled = false;
        btn.innerText = '✨ Сгенерировать';
      }
    }
  </script>
</body>
</html>
