<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAX Studio AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(22, 27, 44, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.12);
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --accent: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --glow: rgba(99, 102, 241, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(236, 72, 153, 0.1) 0%, transparent 40%);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Верхние переключатели режимов */
    .tabs-wrap {
      background: rgba(18, 22, 36, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 4px;
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: var(--primary-gradient);
      color: #fff;
      box-shadow: 0 4px 14px var(--glow);
    }

    /* Блоки ввода */
    .section-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      padding-left: 2px;
    }

    .prompt-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 14px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .prompt-card:focus-within {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    textarea {
      width: 100%;
      height: 74px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.45;
      resize: none;
      outline: none;
    }

    textarea::placeholder {
      color: var(--text-dim);
    }

    /* Стили генерации */
    .styles-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .styles-grid::-webkit-scrollbar {
      display: none;
    }

    .style-chip {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .style-chip:active {
      transform: scale(0.96);
    }

    .style-chip.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: #818cf8;
      color: #fff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
    }

    /* Формат соотношения сторон */
    .format-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .format-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .format-btn .ratio-val {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .format-btn .ratio-sub {
      font-size: 10px;
      color: var(--text-dim);
    }

    .format-btn.active {
      background: rgba(99, 102, 241, 0.18);
      border-color: #818cf8;
    }

    .format-btn.active .ratio-val {
      color: #fff;
    }

    .format-btn.active .ratio-sub {
      color: #cbd5e1;
    }

    /* Главная кнопка генерации */
    .btn-create {
      background: var(--primary-gradient);
      background-size: 200% 200%;
      border: none;
      border-radius: 16px;
      padding: 15px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--glow);
      transition: all 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-create:active {
      transform: scale(0.98);
      box-shadow: 0 3px 10px var(--glow);
    }

    .btn-create:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Область предпросмотра */
    .viewport-box {
      flex: 1;
      background: var(--card-bg);
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 280px;
      position: relative;
    }

    .viewport-box img {
      width: 100%;
      height: 100%;
      max-height: 480px;
      object-fit: contain;
      border-radius: 18px;
      animation: fadeIn 0.4s ease;
    }

    .state-message {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-dim);
      font-size: 13.5px;
      text-align: center;
      padding: 20px;
    }

    /* Анимация пульсации лоадера */
    .loader-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="tabs-wrap">
    <button class="tab-btn active" onclick="switchMode(this, 'image')">
      <span>🖼 Фото</span>
    </button>
    <button class="tab-btn" onclick="switchMode(this, 'video')">
      <span>🎬 Видео</span>
    </button>
  </div>

  <div class="section-box">
    <div class="section-title">Описание сцены</div>
    <div class="prompt-card">
      <textarea id="promptInput" placeholder="Опишите, что создать (например: енот в военной форме)..."></textarea>
    </div>
  </div>

  <div class="section-box">
    <div class="section-title">Стиль арта</div>
    <div class="styles-grid" id="styleList">
      <div class="style-chip active" onclick="setStyle(this, 'Реализм')">📸 Реализм</div>
      <div class="style-chip" onclick="setStyle(this, 'Кино')">🍿 Кино</div>
      <div class="style-chip" onclick="setStyle(this, 'Аниме')">⛩ Аниме</div>
      <div class="style-chip" onclick="setStyle(this, '3D')">🧊 3D Render</div>
      <div class="style-chip" onclick="setStyle(this, 'GTA 5')">🌆 GTA 5</div>
    </div>
  </div>

  <div class="section-box">
    <div class="section-title">Формат кадра</div>
    <div class="format-grid" id="ratioList">
      <div class="format-btn active" onclick="setRatio(this, '1:1')">
        <span class="ratio-val">1:1</span>
        <span class="ratio-sub">Квадрат</span>
      </div>
      <div class="format-btn" onclick="setRatio(this, '9:16')">
        <span class="ratio-val">9:16</span>
        <span class="ratio-sub">Stories / Reels</span>
      </div>
      <div class="format-btn" onclick="setRatio(this, '16:9')">
        <span class="ratio-val">16:9</span>
        <span class="ratio-sub">Широкий</span>
      </div>
    </div>
  </div>

  <button class="btn-create" id="generateBtn" onclick="runGeneration()">
    <span id="btnIcon">✨</span>
    <span id="btnText">Сгенерировать шедевр</span>
  </button>

  <div class="viewport-box" id="viewport">
    <div class="state-message">
      <div style="font-size: 32px; opacity: 0.5;">🎨</div>
      <div>Ваш арт появится здесь</div>
    </div>
  </div>

  <script>
    let mode = 'image';
    let currentStyle = 'Реализм';
    let currentRatio = '1:1';

    const STYLE_PROMPTS = {
      'Реализм': 'hyperrealistic photograph, 8k, raw photo, sharp focus, masterpiece',
      'Кино': 'cinematic frame, dramatic movie lighting, 35mm film still, masterpiece',
      'Аниме': 'anime art, Makoto Shinkai style, vivid colors, crisp lines',
      '3D': '3D render, Pixar style, Unreal Engine 5, smooth textures',
      'GTA 5': 'GTA 5 loading screen style art, Rockstar video game digital art'
    };

    function switchMode(el, selectedMode) {
      mode = selectedMode;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function setStyle(el, styleName) {
      document.querySelectorAll('.style-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      currentStyle = styleName;
    }

    function setRatio(el, ratioVal) {
      document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      currentRatio = ratioVal;
    }

    async function translatePrompt(text) {
      let clean = text.toLowerCase();
      ['сгенерируй', 'сгенирируй', 'создай', 'нарисуй', 'покажи'].forEach(w => {
        clean = clean.replace(w, '');
      });
      clean = clean.trim();

      let extra = '';
      if (clean.includes('енот')) {
        extra = 'raccoon, black eye mask, striped bushy tail';
      }

      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(clean)}`);
        const data = await res.json();
        const translated = data[0].map(s => s[0]).join('');
        return extra ? `${translated}, ${extra}` : translated;
      } catch (e) {
        return extra ? `${clean}, ${extra}` : clean;
      }
    }

    async function runGeneration() {
      const promptInput = document.getElementById('promptInput').value.trim();
      if (!promptInput) {
        alert('Введите описание сцены!');
        return;
      }

      const btn = document.getElementById('generateBtn');
      const btnText = document.getElementById('btnText');
      const viewport = document.getElementById('viewport');

      btn.disabled = true;
      btnText.innerText = 'Создаем шедевр...';

      viewport.innerHTML = `
        <div class="state-message">
          <div class="loader-ring"></div>
          <div style="color: #cbd5e1; font-weight: 500;">Нейросеть рисует кадр...</div>
          <div style="font-size: 11.5px; color: var(--text-dim);">Загрузка займет около 4-8 секунд</div>
        </div>
      `;

      try {
        const englishText = await translatePrompt(promptInput);
        const styleText = STYLE_PROMPTS[currentStyle] || '';
        const fullPrompt = encodeURIComponent(`a photo of ${englishText}, ${styleText}`);

        const sizes = {
          '1:1': 'width=768&height=768',
          '9:16': 'width=576&height=1024',
          '16:9': 'width=1024&height=576'
        };
        const dim = sizes[currentRatio] || sizes['1:1'];
        const seed = Math.floor(Math.random() * 9000000) + 1000000;

        // Скоростной Turbo-эндпоинт (SDXL Lightning)
        const targetUrl = `https://image.pollinations.ai/prompt/${fullPrompt}?${dim}&seed=${seed}&model=turbo&nologo=true`;

        // Скачиваем как бинарный Blob, чтобы обойти блокировки WebView
        const res = await fetch(targetUrl, { referrerPolicy: 'no-referrer' });
        if (!res.ok) throw new Error('Ошибка генерации шлюза');

        const blob = await res.blob();
        const localBlobUrl = URL.createObjectURL(blob);

        viewport.innerHTML = `<img src="${localBlobUrl}" alt="AI Artwork" style="width: 100%; height: 100%; object-fit: contain; border-radius: 18px;">`;

      } catch (err) {
        viewport.innerHTML = `
          <div class="state-message" style="color: #f87171;">
            <div style="font-size: 26px;">⚠️</div>
            <div style="font-size: 13px;">${err.message}. Попробуйте еще раз.</div>
          </div>
        `;
      } finally {
        btn.disabled = false;
        btnText.innerText = 'Сгенерировать шедевр';
      }
    }
  </script>
</body>
</html>
